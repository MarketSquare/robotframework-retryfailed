repos:
  # mypy linter for Python files
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        description: 'Run mypy for static type checking'
        entry: mypy
        language: python
        types_or: [python, pyi]
        require_serial: true

  # Ruff linter for Python files
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        description: "Run 'ruff format' for extremely fast Python formatting"
        entry: ruff format --force-exclude
        language: python
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff
        name: ruff
        description: "Run 'ruff' for extremely fast Python linting"
        entry: ruff check --force-exclude
        language: python
        types_or: [python, pyi, jupyter]
        require_serial: true

  # Robot framework acceptance tests
  - repo: local
    hooks:
      - id: acceptance-tests
        name: acceptance-tests
        description: "Run Robot Framework acceptance tests"
        entry: robot -d results --listener RetryFailed:0:True:TRACE --loglevel INFO atest
        language: system
        pass_filenames: false
        always_run: true
